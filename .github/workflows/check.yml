# 开发分支：只编译检查，不发布。顺便导出 Room 表结构、生成界面截图。
name: Check

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/

      # 截图需要中文字体，否则汉字会显示成方块
      - name: Download CJK fonts
        run: |
          mkdir -p "$RUNNER_TEMP/fonts"
          for w in Regular Medium Bold; do
            curl -sSL -o "$RUNNER_TEMP/fonts/NotoSansSC-$w.otf" \
              "https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-$w.otf"
          done
          ls -la "$RUNNER_TEMP/fonts"

      - name: Record screenshots
        env:
          CJK_FONT_DIR: ${{ runner.temp }}/fonts
        run: gradle :app:recordRoborazziDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/screenshots/
            app/build/reports/tests/
