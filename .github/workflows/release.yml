# 推送到 main 分支后自动编译签名 APK，并发布到 GitHub Releases。
# App 通过 GitHub API 的 releases/latest 检查更新。
name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # 去掉换行、BOM 等非 base64 字符后再解码
        run: printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > release.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="0.1.${VERSION_CODE}"
          TAG="v${NAME}"
          APK="FitLog-${NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="$(git log -1 --pretty=%B)"
          # App 从标签最后一段读取 versionCode，标签格式不要改
          gh release create "$TAG" "$APK" \
            --title "FitLog ${NAME}" --notes "$NOTES" --latest
